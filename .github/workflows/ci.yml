name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          # go.mod declares go 1.27; use it as the single source of truth
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race -timeout 5m ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          # v2 line: v1 binaries are built with older Go and cannot parse
          # go.mod files from newer toolchains
          version: v2.15.0
          args: --timeout=4m

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t urlshortener:ci .

      - name: Smoke test container
        run: |
          # no --rm so the exit reason stays in `docker logs`
          docker run -d -p 8080:8080 --name smoke urlshortener:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then
              echo "healthz ok"
              docker rm -f smoke
              exit 0
            fi
            sleep 1
          done
          echo "container did not become healthy; state + logs:"
          docker inspect smoke --format 'exit={{.State.ExitCode}} status={{.State.Status}}'
          docker logs smoke
          docker rm -f smoke || true
          exit 1
