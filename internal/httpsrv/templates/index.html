{{define "content"}}
<section class="hero">
  <h1>Shorten a URL</h1>
  <form id="shorten-form" hx-post="/api/shorten" hx-target="#recent-body" hx-swap="afterbegin">
    <div class="row">
      <input name="url" type="url" required maxlength="2048" placeholder="https://example.com/long/path" class="grow">
      <button type="submit" class="btn">Shorten</button>
    </div>
    <details class="advanced">
      <summary>Options</summary>
      <div class="row">
        <label>Custom code <input name="custom_code" pattern="[A-Za-z0-9_-]{3,32}" placeholder="my-link" size="10"></label>
        <label>TTL (s, empty = never) <input name="ttl_seconds" type="number" min="0" placeholder="604800"></label>
      </div>
    </details>
  </form>
  <p id="form-msg" class="msg" aria-live="polite"></p>
</section>

<section class="panel">
  <h2>Latest links</h2>
  <table class="tbl">
    <thead><tr><th>Code</th><th>Target</th><th class="n">Clicks</th><th>Created</th><th class="act">Actions</th></tr></thead>
    <tbody id="recent-body">
    {{- range .Links}}
      <tr>
        <td><a class="code" href="/{{.Code}}">{{.Code}}</a></td>
        <td class="urlcell"><a href="{{.URL}}" rel="noopener" target="_blank">{{.URL}}</a></td>
        <td class="n">{{.Clicks}}</td>
        <td>{{humanTime .CreatedAt}}</td>
        <td class="act">
          <button class="mini copy" data-copy="/r/{{.Code}}">copy</button>
          <button class="mini del" data-code="{{.Code}}">del</button>
        </td>
      </tr>
    {{- else}}<tr><td colspan="5" class="empty">no links yet — shorten something above</td></tr>
    {{- end}}
    </tbody>
  </table>
</section>
{{end}}
